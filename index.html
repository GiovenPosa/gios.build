<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Design in Bath &amp; Bristol for Small Businesses | gios.build</title>
    <meta data-rh="true" name="description" content="Websites for small businesses in Bath, Bristol, Somerset, Wiltshire and across the UK. Built to be found on Google, from £600, with a free homepage mockup.">
    <meta data-rh="true" name="keywords" content="web designer bath, web design bath, web designer bristol, web design bristol, small business website, website redesign, web design uk, gios.build">
    <meta name="author" content="Gio Posa">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <!-- where the business is: Bath, in Bath and North East Somerset -->
    <meta name="geo.region" content="GB-BAS">
    <meta name="geo.placename" content="Bath">
    <!-- the tags marked data-rh are each page's own: the build writes every
         page's into its HTML, along with its structured data (vite.config.ts,
         from src/data/seo.ts and src/data/schema.ts), and the app swaps them
         as you move between pages (components/pageMeta.tsx) -->
    <!-- page canonical -->

    <!-- Social preview (Open Graph for sharing) -->
    <meta property="og:site_name" content="gios.build">
    <meta property="og:locale" content="en_GB">
    <meta property="og:type" content="website">
    <meta data-rh="true" property="og:title" content="gios.build | Websites for Small Businesses">
    <meta data-rh="true" property="og:description" content="Most websites blend in. Yours won't. New websites and redesigns from £600, with a free homepage mockup first.">
    <meta data-rh="true" property="og:url" content="https://www.gios.build/">
    <meta data-rh="true" property="og:image" content="https://www.gios.build/og/home.png">
    <meta property="og:image:width" content="2400">
    <meta property="og:image:height" content="1260">
    <meta data-rh="true" property="og:image:alt" content="gios.build: Most websites blend in. Yours won't. Websites for small businesses in Bath, Bristol and across the UK, from £600.">

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta data-rh="true" name="twitter:title" content="gios.build | Websites for Small Businesses">
    <meta data-rh="true" name="twitter:description" content="Most websites blend in. Yours won't. New websites and redesigns from £600, with a free homepage mockup first.">
    <meta data-rh="true" name="twitter:image" content="https://www.gios.build/og/home.png">
    <meta data-rh="true" name="twitter:image:alt" content="gios.build: Most websites blend in. Yours won't. Websites for small businesses in Bath, Bristol and across the UK, from £600.">

    <!-- icons: Google's results use a square one, a multiple of 48px -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#ffffff">

    <!-- structured data -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
